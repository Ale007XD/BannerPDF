<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>BannerBot — Статистика</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BB Статистика">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @font-face { font-family: 'Unbounded'; src: url('/fonts/Unbounded-var.woff2') format('woff2'); font-weight: 200 900; font-display: swap; }
    @font-face { font-family: 'Onest'; src: url('/fonts/Onest-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  </style>
  <style>
    /* Переменные и базовые стили — копия /admin/ (там всё инлайн, общего файла нет). */
    :root {
      --bg:       #f2f0eb;
      --surface:  #ffffff;
      --ink:      #1a1a1a;
      --ink-2:    #5a5650;
      --ink-3:    #9a958f;
      --accent:   #ff3c00;
      --accent2:  #0057ff;
      --ok:       #1a8a1a;
      --border:   #e0ddd7;
      --radius:   16px;
      --radius-sm:8px;
      --shadow:   0 2px 12px rgba(0,0,0,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Onest', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100dvh;
    }

    /* ---- Шапка ---- */
    .site-header {
      background: var(--ink);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .logo-accent { color: var(--accent); }
    .header-badge {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink);
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      text-decoration: none;
    }

    /* ---- Навигация по разделам админки (то же на /admin/, /admin/stats/ и /admin/partners/) ---- */
    .header-nav {
      display: flex; flex-wrap: wrap; gap: 8px;
      max-width: 600px; margin: 0 auto; padding: 0 20px 12px;
    }
    .nav-link {
      font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700;
      color: #fff; text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 12px;
    }
    .nav-link:hover, .nav-link:focus-visible { border-color: #fff; }
    .nav-link[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }

    /* ---- Контент ---- */
    .main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #stats-ui { display: none; flex-direction: column; gap: 12px; }

    /* ---- Карточка ---- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow);
    }
    .card-label {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin-bottom: 14px;
    }

    /* ---- Кнопки ---- */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn--accent { background: var(--accent); color: #fff; }
    .btn--accent:hover { background: #e03000; }
    .btn--ghost { background: var(--bg); color: var(--ink-2); margin-top: 8px; }

    .auth-error { font-size: 13px; color: var(--accent); margin-bottom: 12px; min-height: 20px; }
    .note { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-bottom: 14px; }

    /* ---- Фильтры ---- */
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: 'Onest', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
      outline: none;
    }
    .select:focus { border-color: var(--accent2); background: var(--surface); }

    /* ---- Итоги ---- */
    .period-note { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-item {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 12px 8px;
      text-align: center;
      min-width: 0;
    }
    .stat-value {
      font-family: 'Unbounded', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
    }
    .stat-value--accent { color: var(--accent); }
    .stat-value--ok     { color: var(--ok); }
    .stat-label {
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    /* ---- Детализация ---- */
    .table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 8px 10px 8px 0;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      font-family: 'Unbounded', sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: var(--ink-3);
      white-space: nowrap;
    }
    td.num, th.num { text-align: right; padding-right: 0; font-weight: 700; white-space: nowrap; }
    td.page { overflow-wrap: anywhere; min-width: 110px; }
    tr:last-child td { border-bottom: none; }
    .source {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--ink-2);
    }
    .source--yandex { background: #fff1d6; color: #8a5a00; }
    .source--google { background: #e3edff; color: var(--accent2); }
    .source--server { background: #e0f5e0; color: var(--ok); }
    .muted { color: var(--ink-3); }
    .empty { text-align: center; color: var(--ink-3); font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <span class="logo">Banner<span class="logo-accent">Bot</span></span>
    <span class="header-badge">ADMIN</span>
  </div>
  <nav class="header-nav" aria-label="Разделы админки">
    <a class="nav-link" href="/admin/">ЗАКАЗЫ</a>
    <a class="nav-link" href="/admin/stats/" aria-current="page">СТАТИСТИКА</a>
    <a class="nav-link" href="/admin/partners/">ПАРТНЁРЫ</a>
  </nav>
</header>

<main class="main">

  <!-- ---- НУЖЕН ВХОД ---- -->
  <div class="card" id="login-card" style="display:none;">
    <div class="card-label">Вход</div>
    <div class="auth-error" id="login-error"></div>
    <div class="note">
      Токен вводится на странице заказов. Войдите там и вернитесь сюда в этой же вкладке.
      Чтобы статистика открывалась на любой вкладке, отметьте «Запомнить на этом устройстве».
    </div>
    <a class="btn btn--accent" href="/admin/">Открыть вход</a>
  </div>

  <!-- ---- СТАТИСТИКА ---- -->
  <div id="stats-ui">

    <div class="card">
      <div class="card-label">Период</div>
      <div class="controls">
        <div class="filter-row" id="period-row">
          <button class="filter-btn" data-days="7">7 дней</button>
          <button class="filter-btn active" data-days="30">30 дней</button>
          <button class="filter-btn" data-days="90">90 дней</button>
          <button class="filter-btn" data-days="365">Год</button>
        </div>
        <select class="select" id="source-filter" aria-label="Источник">
          <option value="">Все источники</option>
        </select>
      </div>
    </div>

    <div class="card" id="totals-card">
      <div class="card-label">Итоги по событиям</div>
      <div class="period-note" id="period-note"></div>
      <div id="totals-area"><div class="empty">Загрузка…</div></div>
    </div>

    <div class="card" id="rows-card">
      <div class="card-label">Детализация</div>
      <div id="rows-area"></div>
    </div>

  </div>
</main>

<script>
/* Ключ и хранилища те же, что в /admin/: sessionStorage (по умолчанию) и localStorage («Запомнить»).
   Если в /admin/index.html поменяется TOKEN_KEY, поменять и здесь. */
const TOKEN_KEY = "bp_admin_token";
const API_BASE  = "/api";

function loadSavedToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
function forgetToken() {
  try { sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY); } catch { /* нечего чистить */ }
}

const $ = (id) => document.getElementById(id);

// Порядок вывода итогов: воронка сверху, остальные события по убыванию.
const EVENT_ORDER = ["pageview", "prefill", "preview_generated", "start_order", "payment_started",
                     "order_paid", "file_downloaded", "download_success", "example_click", "cta_click"];

let _token = loadSavedToken();
let _days  = 30;
let _data  = null;
let _reqId = 0;   // защита от гонки: ответ на устаревший запрос игнорируется

function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmt(n) { return Number(n || 0).toLocaleString("ru-RU"); }

function showLogin(message) {
  $("stats-ui").style.display = "none";
  $("login-card").style.display = "block";
  $("login-error").textContent = message || "";
}
function showStats() {
  $("login-card").style.display = "none";
  $("stats-ui").style.display = "flex";
}

async function loadStats() {
  if (!_token) { showLogin("Нет сохранённого токена."); return; }

  const id = ++_reqId;
  showStats();
  $("period-note").textContent = "";
  $("totals-area").innerHTML = '<div class="empty">Загрузка…</div>';
  $("rows-area").innerHTML = "";

  try {
    const resp = await fetch(`${API_BASE}/admin/events?days=${_days}`, {
      headers: { "Authorization": `Bearer ${_token}` },
    });
    if (id !== _reqId) return;

    if (resp.status === 401 || resp.status === 403) {
      forgetToken();
      _token = "";
      showLogin("Токен не подошёл. Введите его заново на странице заказов.");
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    _data = await resp.json();
    if (id !== _reqId) return;
    renderSourceOptions();
    render();
  } catch (e) {
    if (id !== _reqId) return;
    $("totals-area").innerHTML =
      '<div class="auth-error">Не удалось загрузить статистику (' + escapeHtml(e.message) + ').</div>' +
      '<button class="btn btn--ghost" id="retry-btn">Повторить</button>';
    $("retry-btn").addEventListener("click", loadStats);
  }
}

function renderSourceOptions() {
  const sel = $("source-filter");
  const keep = sel.value;
  const sources = [...new Set((_data.rows || []).map((r) => r.source).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Все источники</option>' +
    sources.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  sel.value = sources.includes(keep) ? keep : "";
}

function render() {
  if (!_data) return;

  $("period-note").textContent = `С ${_data.since} · ${_data.days} дн.`;

  const totals = _data.totals || {};
  const keys = Object.keys(totals).sort((a, b) => {
    let ia = EVENT_ORDER.indexOf(a), ib = EVENT_ORDER.indexOf(b);
    if (ia === -1) ia = 999;
    if (ib === -1) ib = 999;
    return ia - ib || totals[b] - totals[a];
  });

  if (!keys.length) {
    $("totals-area").innerHTML = '<div class="empty">За этот период событий нет.</div>';
  } else {
    $("totals-area").innerHTML = '<div class="stats-row">' + keys.map((ev) => {
      const cls = ev === "order_paid" ? " stat-value--ok" : ev === "pageview" ? " stat-value--accent" : "";
      return `<div class="stat-item"><div class="stat-value${cls}">${fmt(totals[ev])}</div>` +
             `<div class="stat-label">${escapeHtml(ev)}</div></div>`;
    }).join("") + "</div>";
  }

  const src = $("source-filter").value;
  const rows = (_data.rows || []).filter((r) => !src || r.source === src);

  if (!rows.length) {
    $("rows-area").innerHTML = '<div class="empty">Нет строк для выбранного источника.</div>';
    return;
  }

  $("rows-area").innerHTML =
    '<div class="table-wrap"><table><thead><tr>' +
    '<th>Событие</th><th>Страница</th><th>Источник</th><th>Метка</th><th class="num">Кол-во</th>' +
    "</tr></thead><tbody>" +
    rows.map((r) => {
      const s = escapeHtml(r.source);
      return "<tr>" +
        `<td>${escapeHtml(r.event)}</td>` +
        `<td class="page">${escapeHtml(r.page)}</td>` +
        `<td><span class="source source--${s}">${s}</span></td>` +
        `<td>${r.detail ? escapeHtml(r.detail) : '<span class="muted">—</span>'}</td>` +
        `<td class="num">${fmt(r.n)}</td>` +
        "</tr>";
    }).join("") +
    "</tbody></table></div>";
}

document.querySelectorAll("#period-row .filter-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#period-row .filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    _days = parseInt(btn.dataset.days, 10);
    loadStats();
  });
});
$("source-filter").addEventListener("change", render);

loadStats();
</script>
</body>
</html>
