# Шаблон: редирект домена типографии-партнёра на её брендированную страницу конструктора.
# Подставьте PARTNER_DOMAIN (например print-example.ru) и PARTNER_CODE (slug партнёра из POST /api/admin/partners).
#
# Файл НЕ подключается автоматически: docker-compose монтирует в nginx только default.conf.
# Чтобы применить, добавьте блоки в default.conf (или смонтируйте копию в /etc/nginx/conf.d/) и перезагрузите nginx.
#
# Условия: A-запись PARTNER_DOMAIN (и www) указывает на IP этого сервера; для HTTPS нужен сертификат
# Let's Encrypt для этого домена (выпустите тем же способом, каким выпущен сертификат bannerbot.ru).
# Если домен у регистратора или DNS-провайдера (Cloudflare и т.п.) умеет сам делать редирект
# с HTTPS на внешний адрес, наш сервер вообще не нужен: укажите там целевой адрес из строки return ниже.
#
# 302, а не 301: браузеры кэшируют 301 навсегда, и смену кода или отключение партнёра пришлось бы
# ждать у каждого посетителя. Абсолютный редирект: путь и параметры исходного адреса отбрасываются
# (в return нет $request_uri), любой адрес на домене ведёт на одну страницу.

server {
    listen 80;
    server_name PARTNER_DOMAIN www.PARTNER_DOMAIN;
    return 302 https://bannerbot.ru/?partner=PARTNER_CODE;
}

server {
    listen 443 ssl;
    http2 on;
    server_name PARTNER_DOMAIN www.PARTNER_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/PARTNER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PARTNER_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 302 https://bannerbot.ru/?partner=PARTNER_CODE;
}
