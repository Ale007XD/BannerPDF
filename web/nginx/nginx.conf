# ============================================================
# BannerPrint — nginx/nginx.conf
# Rate limit зоны объявляются здесь (в http-блоке),
# server-блок подключается из default.conf
# ============================================================

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Журнал доступа без полных IP-адресов: IPv4 → сеть /24 (последний октет 0),
    # IPv6 → первые три группы. Полный адрес в файл не попадает. Лимиты запросов
    # (limit_req) работают по настоящему адресу в памяти nginx и в журнал не пишутся.
    map $remote_addr $remote_addr_anon {
        default                                                      0.0.0.0;
        "~^(?P<net4>\d+\.\d+\.\d+)\.\d+$"                          $net4.0;
        "~^(?P<net6>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $net6::;
    }

    log_format main '$remote_addr_anon - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # ---- Rate limit зоны ----
    # preview: 30 req/min = 0.5 req/sec
    limit_req_zone $binary_remote_addr zone=preview_limit:10m rate=30r/m;

    # order: 5 req/min
    limit_req_zone $binary_remote_addr zone=order_limit:10m rate=5r/m;

    # download: 10 req/min/IP (защита от брутфорса токенов)
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=10r/m;

    # promo: 20 req/min/IP — проверка промокода при вводе (дебаунс на сайте), защита от перебора кодов.
    limit_req_zone $binary_remote_addr zone=promo_limit:10m rate=20r/m;

    # Все четыре зоны подключены в default.conf: preview_limit (location = /api/preview),
    # order_limit (location = /api/order), download_limit (location /api/download/),
    # promo_limit (location = /api/promo/check). Объявленная, но не применённая зона ничего не ограничивает.
    # beat: собственный счётчик событий (location = /api/beat в default.conf).
    limit_req_zone $binary_remote_addr zone=beat_limit:5m rate=120r/m;

    # send: кнопка «Отправить в …» (макет на почту типографии): запрос может рендерить PDF и ходит в SMTP.
    # Подключена в default.conf: location /api/partner/send/.
    limit_req_zone $binary_remote_addr zone=send_limit:10m rate=6r/m;

    include /etc/nginx/conf.d/*.conf;
}
