server {
    listen 80;
    server_name bannerbot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bannerbot.ru;

    ssl_certificate /etc/letsencrypt/live/bannerbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bannerbot.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /app/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Статика без SPA-fallback: несуществующий адрес отдаёт настоящий 404
    # (раньше любой URL, включая /robots.txt и /sitemap.xml, отвечал 200 с HTML
    # конструктора — поисковики видели soft-404 и «robots.txt» из HTML).
    # Роутинга по путям на фронте нет (только ?query), fallback не нужен.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /admin/ {
        alias /app/frontend/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
