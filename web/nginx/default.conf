# Один канонический адрес — https://bannerbot.ru. Любой хост на :80 уходит туда одним
# редиректом (раньше www.bannerbot.ru отвечал 200 и дублировал весь сайт).
server {
    listen 80;
    server_name bannerbot.ru www.bannerbot.ru;
    return 301 https://bannerbot.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;  # директива с nginx 1.25.1; образ nginx:1.25-alpine её поддерживает
    server_name bannerbot.ru;

    ssl_certificate /etc/letsencrypt/live/bannerbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bannerbot.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /app/frontend;
    index index.html;

    # Проверка промокода: тот же прокси, что и /api/, плюс лимит от перебора кодов.
    # Точный location приоритетнее префиксного /api/, поэтому заголовки повторены целиком.
    location = /api/promo/check {
        limit_req zone=promo_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Создание заказа: не больше 5 в минуту с IP (burst 2). Каждый заказ с промокодом резервирует
    # использование, а каждый платёжный заказ создаёт платёж в ЮKassa, поэтому массовые запросы без оплаты
    # режем здесь. Точный location: /api/order/{id}/amend и /abandon остаются на общем /api/.
    location = /api/order {
        limit_req zone=order_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Превью: каждый запрос рендерит картинку на сервере, сайт шлёт его на каждую правку (дебаунс 500 мс).
    # 30 в минуту при burst 10 человеку хватает; при 429 сайт сам повторяет запрос (см. fetchPreview в app.js).
    location = /api/preview {
        limit_req zone=preview_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Скачивание PDF: токен в пути, запрос рендерит файл (Ghostscript), поэтому и перебор токенов, и массовые
    # скачивания режем. 429 приходит от nginx до API: токен при этом не расходуется.
    # Префиксный location, но длиннее /api/, поэтому выигрывает у него; соседние пути (/api/order/...) не задеты.
    location /api/download/ {
        limit_req zone=download_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Собственный счётчик событий: приложение не получает IP посетителя (заголовки
    # X-Real-IP и X-Forwarded-For не передаются), запрос не пишется в access-лог.
    location = /api/beat {
        limit_req zone=beat_limit burst=30 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Статика без SPA-fallback: несуществующий адрес отдаёт настоящий 404
    # (раньше любой URL, включая /robots.txt и /sitemap.xml, отвечал 200 с HTML
    # конструктора — поисковики видели soft-404 и «robots.txt» из HTML).
    # Роутинга по путям на фронте нет (только ?query), fallback не нужен.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Кэш статики. Версия в адресе (?v=N) правится руками, поэтому без `immutable`:
    # забытый bump не должен залипнуть у посетителей на год — максимум на сутки.
    # Регэкспы строго по полному пути, чтобы не задеть /admin/ и /api/.
    location ~ ^/(style\.css|app\.js|prefill\.js|kit\.js|partner\.js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|static/og/[\w.-]+\.jpg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Шрифты (woff2) и тексты лицензий: кэш неделя, как у остальной статики.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location /admin/ {
        alias /app/frontend/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# www по HTTPS: тот же сертификат (в нём должен быть www.bannerbot.ru) и 301 на корневой домен.
# Блок стоит ПОСЛЕ основного: default_server для :443 остаётся за основным сайтом.
server {
    listen 443 ssl;
    http2 on;
    server_name www.bannerbot.ru;

    ssl_certificate /etc/letsencrypt/live/bannerbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bannerbot.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://bannerbot.ru$request_uri;
}
